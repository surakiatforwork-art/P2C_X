plugins { id 'com.android.application' }
android {
    namespace 'com.phantom.p2cx'
    compileSdk 36
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.phantom.p2cx'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.9.1'
        buildConfigField 'String', 'CONTROL_URL', '"' + providers.gradleProperty('p2cxControlUrl').getOrElse('https://p2cx-control.vercel.app/api/access').replace('"', '') + '"'
        testInstrumentationRunner 'com.phantom.p2cx.ContractChecks'
    }
    buildTypes {
        release {
            // Preserve the certificate used by existing distributed APKs so updates install in place.
            signingConfig signingConfigs.debug
            debuggable false
        }
    }
}
dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:101.0.0'
}
